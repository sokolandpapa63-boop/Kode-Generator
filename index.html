<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор кодов — Этикетки OZON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Golos Text', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h1 { color: #0a5e7e; margin-bottom: 20px; }
        .toolbar { background: #f8f9fc; border-radius: 16px; padding: 20px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .flex-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; align-items: flex-end; }
        .input-group { flex: 1; min-width: 150px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; color: #2c3e66; }
        textarea, input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 0.95rem; font-family: 'Golos Text', sans-serif; background: white; }
        textarea { font-family: 'Courier New', monospace; min-height: 120px; }
        button { background: #0f6b8c; color: white; border: none; padding: 10px 24px; border-radius: 40px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.2s; font-family: 'Golos Text', sans-serif; }
        button:hover { background: #0a4e6b; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #4a5b6e; }
        .btn-warning { background: #b91c1c; }
        .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        .main-tabs button { background: transparent; color: #2c3e66; border-radius: 12px 12px 0 0; padding: 10px 22px; border: 2px solid transparent; border-bottom: none; font-size: 1rem; }
        .main-tabs button.active { background: white; border-color: #0f6b8c; color: #0a4e6b; font-weight: bold; }
        .hidden { display: none !important; }
        .footer-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="container">
    <h1>📦 Генератор кодов — Этикетки OZON</h1>
    <div class="main-tabs">
        <button id="tabMain" class="active">🔳 Обычные коды</button>
        <button id="tabLabels">🖨️ Этикетки OZON (A4)</button>
    </div>

    <div id="panelMain">
        <div class="toolbar">
            <div class="flex-row">
                <div class="input-group" style="flex:2;">
                    <label>📝 Список значений (каждое с новой строки)</label>
                    <textarea id="barcodeList" placeholder="Введите значения..."></textarea>
                </div>
            </div>
            <div class="flex-row">
                <div class="input-group" style="max-width:200px;">
                    <label>📏 Размер QR (px)</label>
                    <input type="number" id="sizeInput" value="150" step="10" min="80">
                </div>
                <div><button id="generateBtn">✨ СГЕНЕРИРОВАТЬ QR</button></div>
            </div>
        </div>
        <div id="gridContainer" style="display:flex; flex-wrap:wrap; gap:15px; margin-top:20px;"></div>
    </div>

    <div id="panelLabels" class="hidden">
        <div class="toolbar">
            <div class="flex-row">
                <div class="input-group" style="flex:2;">
                    <label>📋 Список кодов (формат: <code>10_цифр-текст</code>)</label>
                    <textarea id="labelCodesList" placeholder="0123456789-0018-&#10;9876543210-ABC-123" style="min-height:120px;"></textarea>
                </div>
            </div>
            <div class="flex-row">
                <div class="input-group">
                    <label>🏷️ Текст по умолчанию</label>
                    <input type="text" id="labelDefaultText" value="ХИМКИ_235">
                </div>
                <div class="input-group">
                    <label>📏 DPI</label>
                    <select id="labelDpi">
                        <option value="203">203</option>
                        <option value="300" selected>300</option>
                        <option value="600">600</option>
                    </select>
                </div>
                <div><button id="generateLabelsBtn">✨ Сгенерировать PDF</button></div>
            </div>
        </div>
    </div>
</div>

<script>
// =====================================================================
// ===== СЮДА ВСТАВЬ БЛОК digitImages ИЗ СООБЩЕНИЯ 2 =====
// =====================================================================
const digitImages = {
    '0': 'digits/0.png',
    '1': 'digits/1.png',
    '2': 'digits/2.png',
    '3': 'digits/3.png',
    '4': 'digits/4.png',
    '5': 'digits/5.png',
    '6': 'digits/6.png',
    '7': 'digits/7.png',
    '8': 'digits/8.png',
    '9': 'digits/9.png',
    '-': 'digits/dash.png'
};
// =====================================================================
// ===== ЗАГРУЗКА ВСЕХ КАРТИНОК ПЕРЕД ГЕНЕРАЦИЕЙ =====
// =====================================================================
const loadedImages = {};
let imagesLoaded = false;

function preloadImages() {
    return new Promise((resolve) => {
        let count = 0;
        const keys = Object.keys(digitImages);
        keys.forEach(key => {
            const img = new Image();
            img.onload = () => {
                loadedImages[key] = img;
                count++;
                if (count === keys.length) { imagesLoaded = true; resolve(); }
            };
            img.onerror = () => {
                count++;
                if (count === keys.length) { imagesLoaded = true; resolve(); }
            };
            img.src = digitImages[key];
        });
    });
}

// =====================================================================
// ===== ОСТАЛЬНАЯ ЛОГИКА =====
// =====================================================================
const tabMain = document.getElementById('tabMain');
const tabLabels = document.getElementById('tabLabels');
const panelMain = document.getElementById('panelMain');
const panelLabels = document.getElementById('panelLabels');
const barcodeList = document.getElementById('barcodeList');
const generateBtn = document.getElementById('generateBtn');
const sizeInput = document.getElementById('sizeInput');
const gridContainer = document.getElementById('gridContainer');
const labelCodesList = document.getElementById('labelCodesList');
const labelDefaultText = document.getElementById('labelDefaultText');
const labelDpi = document.getElementById('labelDpi');
const generateLabelsBtn = document.getElementById('generateLabelsBtn');

tabMain.addEventListener('click', () => {
    tabMain.classList.add('active');
    tabLabels.classList.remove('active');
    panelMain.classList.remove('hidden');
    panelLabels.classList.add('hidden');
});
tabLabels.addEventListener('click', () => {
    tabLabels.classList.add('active');
    tabMain.classList.remove('active');
    panelLabels.classList.remove('hidden');
    panelMain.classList.add('hidden');
});

const mmToPx = (mm, dpi) => Math.round(mm * dpi / 25.4);

function invertImage(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        if (data[i] < 128) {
            data[i] = 255; data[i+1] = 255; data[i+2] = 255;
        }
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
}

function drawImageString(ctx, str, x, y, size, spacing, isInverted = false) {
    let currentX = x;
    for (let char of str) {
        const img = loadedImages[char];
        if (img) {
            if (isInverted) {
                const invCanvas = invertImage(img);
                ctx.drawImage(invCanvas, currentX, y, size, size);
            } else {
                ctx.drawImage(img, currentX, y, size, size);
            }
            currentX += size + spacing;
        }
    }
    return currentX;
}

function measureImageString(str, size, spacing) {
    return str.length * (size + spacing) - spacing;
}

function generateQR(value, size) {
    return new Promise((resolve) => {
        const tempDiv = document.createElement('div');
        try {
            new QRCode(tempDiv, {
                text: value, width: size, height: size,
                colorDark: '#000000', colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
            setTimeout(() => {
                const canvas = tempDiv.querySelector('canvas');
                if (canvas) resolve(canvas);
                else {
                    const img = tempDiv.querySelector('img');
                    if (img && img.src) {
                        const c = document.createElement('canvas');
                        c.width = size; c.height = size;
                        c.getContext('2d').drawImage(img, 0, 0, size, size);
                        resolve(c);
                    } else resolve(null);
                }
            }, 30);
        } catch(e) { resolve(null); }
    });
}

generateBtn.addEventListener('click', async () => {
    if (!imagesLoaded) await preloadImages();
    const raw = barcodeList.value.split(/\r?\n/).filter(l => l.trim());
    if (raw.length === 0) { alert('Введите хотя бы один код!'); return; }
    
    gridContainer.innerHTML = '';
    const sizeVal = parseInt(sizeInput.value, 10);
    
    for (let val of raw) {
        const qrCanvas = await generateQR(val, sizeVal);
        if (qrCanvas) {
            const card = document.createElement('div');
            card.style.cssText = 'display:inline-block; margin:5px; text-align:center; background:white; padding:10px; border-radius:8px; border:1px solid #ddd;';
            card.appendChild(qrCanvas);
            const textDiv = document.createElement('div');
            textDiv.innerText = val;
            textDiv.style.cssText = 'font-size:10px; margin-top:5px; word-break:break-all;';
            card.appendChild(textDiv);
            gridContainer.appendChild(card);
        }
    }
});

async function drawLabel(ctx, pos, labelW, labelH, codeData, defaultText, dpi) {
    if (!imagesLoaded) await preloadImages();
    const qrValue = codeData.qr;

    // Рамка
    ctx.save();
    ctx.strokeStyle = '#999';
    ctx.lineWidth = Math.max(1, mmToPx(0.3, dpi));
    ctx.setLineDash([mmToPx(2, dpi), mmToPx(1.5, dpi)]);
    ctx.strokeRect(pos.x + mmToPx(1, dpi), pos.y + mmToPx(1, dpi), labelW - mmToPx(2, dpi), labelH - mmToPx(2, dpi));
    ctx.restore();

    // QR
    const qrSize = mmToPx(40, dpi);
    const qrCanvas = await generateQR(qrValue, qrSize);
    if (qrCanvas) {
        ctx.drawImage(qrCanvas, pos.x + (labelW - qrSize) / 2, pos.y + mmToPx(5, dpi));
    }

    // Текст по умолчанию
    ctx.save();
    ctx.fillStyle = '#000';
    ctx.font = `600 ${mmToPx(5.5, dpi)}px 'Golos Text', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(defaultText || 'ХИМКИ_235', pos.x + labelW / 2, pos.y + mmToPx(50, dpi));
    ctx.restore();

    // Основной код (картинками)
    ctx.save();
    const firstDashIndex = qrValue.indexOf('-');
    let line1 = qrValue;
    let line2 = '';
    if (firstDashIndex !== -1) {
        line1 = qrValue.substring(0, firstDashIndex).trim();
        line2 = qrValue.substring(firstDashIndex).trim();
    }

    let prefixPart = line1;
    let last4Part = '';
    if (line1.length === 10) {
        prefixPart = line1.substring(0, 6);
        last4Part = line1.substring(6);
    } else if (line1.length > 4) {
        prefixPart = line1.slice(0, -4);
        last4Part = line1.slice(-4);
    }

    const digitSize = mmToPx(10, dpi);
    const spacing = mmToPx(0.5, dpi);

    const prefixWidth = measureImageString(prefixPart, digitSize, spacing);
    const last4Width = measureImageString(last4Part, digitSize, spacing);
    const fullWidth = prefixWidth + last4Width + (prefixPart && last4Part ? spacing : 0);

    const startX = pos.x + (labelW - fullWidth) / 2;
    const line1Y = pos.y + mmToPx(62, dpi);

    // Подложка
    if (last4Part) {
        const bgPadX = mmToPx(0.5, dpi);
        const bgPadY = mmToPx(0.5, dpi);
        const radius = mmToPx(1, dpi);
        ctx.fillStyle = '#000';
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(startX + prefixWidth + (prefixPart?spacing:0) - bgPadX, line1Y - bgPadY, last4Width + bgPadX*2, digitSize + bgPadY*2, radius);
        } else {
            ctx.rect(startX + prefixWidth + (prefixPart?spacing:0) - bgPadX, line1Y - bgPadY, last4Width + bgPadX*2, digitSize + bgPadY*2);
        }
        ctx.fill();
    }

    // Рисуем префикс
    if (prefixPart) {
        drawImageString(ctx, prefixPart, startX, line1Y, digitSize, spacing, false);
    }
    // Рисуем подложку (инвертированные)
    if (last4Part) {
        drawImageString(ctx, last4Part, startX + prefixWidth + (prefixPart?spacing:0), line1Y, digitSize, spacing, true);
    }

    // Вторая строка
    if (line2) {
        const line2Width = measureImageString(line2, digitSize * 0.8, spacing);
        const line2X = pos.x + (labelW - line2Width) / 2;
        const line2Y = line1Y + digitSize + mmToPx(4, dpi);
        drawImageString(ctx, line2, line2X, line2Y, digitSize * 0.8, spacing, false);
    }

    ctx.restore();
}

async function renderSheetCanvas(codes, dpi) {
    const pageW = mmToPx(210, dpi);
    const pageH = mmToPx(297, dpi);
    const labelW = mmToPx(75, dpi);
    const labelH = mmToPx(120, dpi);
    const margin = mmToPx(5, dpi);
    const gap = mmToPx(3, dpi);

    const canvas = document.createElement('canvas');
    canvas.width = pageW;
    canvas.height = pageH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, pageW, pageH);

    const positions = [
        { x: margin, y: margin },
        { x: margin + labelW + gap, y: margin },
        { x: margin, y: margin + labelH + gap },
        { x: margin + labelW + gap, y: margin + labelH + gap }
    ];

    for (let i = 0; i < codes.length && i < 4; i++) {
        await drawLabel(ctx, positions[i], labelW, labelH, codes[i], labelDefaultText.value, dpi);
    }
    return canvas;
}

generateLabelsBtn.addEventListener('click', async () => {
    if (!imagesLoaded) await preloadImages();
    const raw = labelCodesList.value.split(/\r?\n/).filter(l => l.trim());
    if (raw.length === 0) { alert('Введите хотя бы один код!'); return; }

    const codes = raw.map(line => {
        const parts = line.split(';').map(s => s.trim());
        return { qr: parts[0], bottom: parts.length > 1 ? parts[1] : '' };
    });

    const dpi = parseInt(labelDpi.value, 10);
    const sheets = [];
    for (let i = 0; i < codes.length; i += 4) sheets.push(codes.slice(i, i + 4));

    generateLabelsBtn.disabled = true;
    generateLabelsBtn.textContent = '⏳ Генерация...';

    try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        for (let s = 0; s < sheets.length; s++) {
            const canvas = await renderSheetCanvas(sheets[s], dpi);
            const imgData = canvas.toDataURL('image/png');
            if (s > 0) pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
        }
        pdf.save(`ozon_labels_${dpi}dpi.pdf`);
    } catch (err) {
        alert('Ошибка при генерации PDF: ' + err.message);
    } finally {
        generateLabelsBtn.disabled = false;
        generateLabelsBtn.textContent = '✨ Сгенерировать PDF';
    }
});

// Инициализация
preloadImages();
</script>
</body>
</html>
